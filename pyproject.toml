[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "promptforge"
version = "0.1.1"
description = "Framework for building reusable AI skills."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "PyYAML>=6.0",
]

authors = [
    { name = "PromptForge Contributors" }
]

[project.scripts]
promptforge = "promptforge.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]